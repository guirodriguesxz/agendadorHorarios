spring.application.name=agendador-horarios

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agendador}
spring.datasource.username=${DB_USER:agendador}
spring.datasource.password=${DB_PASSWORD:agendador}

# Schema versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

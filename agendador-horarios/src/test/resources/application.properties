# Testes rodam com H2 em modo PostgreSQL, aplicando as mesmas migrations do Flyway
spring.datasource.url=jdbc:h2:mem:agendador-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
